# Basics
DESIGN_NAME: ibex_top
VERILOG_FILES:
  - dir::src/ibex_top.sv
  - dir::src/ibex_pkg.sv
  - dir::src/ibex_alu.sv
  - dir::src/ibex_compressed_decoder.sv
  - dir::src/ibex_controller.sv
  - dir::src/ibex_counter.sv
  - dir::src/ibex_cs_registers.sv
  - dir::src/ibex_csr.sv
  - dir::src/ibex_decoder.sv
  - dir::src/ibex_ex_block.sv
  - dir::src/ibex_fetch_fifo.sv
  - dir::src/ibex_id_stage.sv
  - dir::src/ibex_if_stage.sv
  - dir::src/ibex_load_store_unit.sv
  - dir::src/ibex_multdiv_fast.sv
  - dir::src/ibex_multdiv_slow.sv
  - dir::src/ibex_pmp.sv
  - dir::src/ibex_prefetch_buffer.sv
  - dir::src/ibex_register_file_ff.sv
  - dir::src/ibex_wb_stage.sv
  - dir::src/ibex_core.sv
  - dir::src/prim_clock_gating.v
VERILOG_INCLUDE_DIRS:
  - dir::src/vendor/lowrisc_ip/prim/rtl
CLOCK_PERIOD: 10
CLOCK_PORT: clk_i
PNR_SDC_FILE: dir::src/impl.sdc
SIGNOFF_SDC_FILE: dir::src/signoff.sdc

# Synthesis
USE_SLANG: true
SYNTH_WRITE_NOATTR: false
ERROR_ON_SYNTH_CHECKS: false

# PDN
PDN_VOFFSET: 5
PDN_HOFFSET: 5
PDN_VWIDTH: 2
PDN_HWIDTH: 2
PDN_VPITCH: 30
PDN_HPITCH: 30
PDN_SKIPTRIM: true

# Technology-Specific Configs
pdk::sky130*:
  FP_CORE_UTIL: 45
  CLOCK_PERIOD: 10

# DFT
DFT_TV_TEST_THREADS: 1
DFT_TEST_MODE_WIRE: test_en_i
DFT_TEST_CLOCK_WIRE: clk_i
DFT_SCAN_IN_PATTERN: sci
DFT_SCAN_OUT_PATTERN: sco
DFT_SCAN_ENABLE_PATTERN: sce
scl::sky130_fd_sc_hd:
  DFT_JSON_MAPPING: dir::../../tech/sky130_fd_sc_hd_mapping.json
scl::gf180mcu_fd_sc_mcu7t5v0:
  DFT_JSON_MAPPING: dir::../../tech/gf180mcu_fd_sc_mcu7t5v0_mapping.json
DFT_BSCAN_EXCLUDE_IO:
  - clk_i
  - test_en_i
  - "!rst_ni"

meta:
  flow: DifettoPNR
